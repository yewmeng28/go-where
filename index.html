<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GoWhere?</title>
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-title" content="GoWhere">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <h1>GoWhere<svg class="logo" viewBox="225 80 585 860" aria-label="?"><use href="#logo" x="0" y="0" width="888" height="888"/></svg></h1>
  <span class="tag">save any place</span>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14m6-12v14"/></svg>Map</button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>List</button>
  <button data-tab="goWhere"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/></svg>Go Where?</button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1.6"/><circle cx="16" cy="12" r="1.6"/><circle cx="10" cy="17" r="1.6"/></svg>Manage</button>
  <button data-tab="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>About</button>
</nav>

<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<!-- shared location-pin symbol: used in the header, on markers and on the icon -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- app mark: pin with a white question mark, dark-outlined, in front of its edge (matches tools/make_icons.py) -->
  <symbol id="logo" viewBox="0 0 1024 1024">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M512 130A240 240 0 0 0 301.6 485.4L512 870" stroke="currentColor" stroke-width="60"/>
      <path d="M286.5 287.9A240 240 0 1 1 632 577.9Q512 647.1 512 690V725" stroke="#0f1720" stroke-width="100"/>
      <path d="M286.5 287.9A240 240 0 1 1 632 577.9Q512 647.1 512 690V725" stroke="#fff" stroke-width="60"/>
    </g>
    <circle cx="512" cy="870" r="68" fill="#0f1720"/><circle cx="512" cy="870" r="48" fill="#fff"/>
    <circle cx="512" cy="370" r="60" fill="currentColor"/>
  </symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.7" fill="#0f1720"/></symbol>
</svg>

<script src="app.js"></script>
</body>
</html>
